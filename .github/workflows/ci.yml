name: SnapRAG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rag-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall app main.py benchmarks

      - name: Run tests
        run: python -m pytest

      - name: Check the long-conversation benchmark end to end (stand-in system)
        run: python -m benchmarks.longconv.run --dry-run --variants no_memory,full --turns 100 --out /tmp/dry.json


  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install frontend dependencies
        run: pip install -r requirements.txt

      - name: Check Streamlit app
        run: python -m py_compile app.py api.py
