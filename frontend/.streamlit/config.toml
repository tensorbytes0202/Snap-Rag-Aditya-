[server]
maxUploadSize = 50          # MB, same cap as the backend

[browser]
gatherUsageStats = false

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
headingFontWeights = [650, 650, 600, 600, 600, 600]

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor = "#1B1F2A"
borderColor = "#E3E6EF"
blueColor = "#2563EB"
greenColor = "#16A34A"
orangeColor = "#D97706"
redColor = "#DC2626"
grayColor = "#6B7280"

[theme.light.sidebar]
backgroundColor = "#F5F6FA"
secondaryBackgroundColor = "#E9ECF5"

[theme.dark]
primaryColor = "#6366F1"
backgroundColor = "#0F1117"
secondaryBackgroundColor = "#181B24"
textColor = "#E6E8EF"
borderColor = "#2A2F3D"
blueColor = "#60A5FA"
greenColor = "#4ADE80"
orangeColor = "#FBBF24"
redColor = "#F87171"
grayColor = "#9CA3AF"

[theme.dark.sidebar]
backgroundColor = "#0B0D12"
secondaryBackgroundColor = "#181B24"
